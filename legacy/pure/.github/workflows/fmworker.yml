name: fmWorker desktop packages
on:
  workflow_dispatch:
  push:
    paths: ['fmWorker/**', 'agent/**', 'node_models.py', '.github/workflows/fmworker.yml']
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: fmWorker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: fmWorker/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Build pinned native sidecar
        run: python scripts/build_bridge.py
      - name: Build desktop bundle
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: fmWorker-${{ matrix.os }}
          path: |
            fmWorker/src-tauri/target/release/bundle/dmg/*.dmg
            fmWorker/src-tauri/target/release/bundle/nsis/*.exe
            fmWorker/src-tauri/target/release/bundle/msi/*.msi
