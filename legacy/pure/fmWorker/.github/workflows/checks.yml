name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: npm run typecheck && npm test && node --test tests/chrome-extension.test.mjs && npm run build
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/prepare_assets.py
      - run: python -m pytest tests -q
