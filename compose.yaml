services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: fumiao
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}'
      POSTGRES_DB: fumiao
    volumes: ['postgres:/var/lib/postgresql']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U fumiao -d fumiao']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:8-bookworm
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes: ['redis:/data']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build: .
    command: [pnpm, 'db:migrate']
    env_file: '${FUMIAO_SERVICE_ENV:-.env}'
    environment: &environment
      API_PROTOCOL: original
      API_HOST: '0.0.0.0'
      DATABASE_URL: 'postgresql://fumiao:${POSTGRES_PASSWORD}@postgres:5432/fumiao'
      REDIS_URL: 'redis://redis:6379'
      MEDIA_DIRECTORY: /app/media
      PORT: 4000
      PUBLIC_URL: '${PUBLIC_URL:?Set PUBLIC_URL to the browser origin}'
    depends_on:
      postgres: {condition: service_healthy}
  api: &api
    build: .
    command: [pnpm, 'start:api']
    env_file: '${FUMIAO_SERVICE_ENV:-.env}'
    environment: *environment
    volumes: ['media:/app/media']
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:4000/health").then(r => { if (!r.ok) process.exitCode = 1 }).catch(() => process.exitCode = 1)']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api-v2:
    <<: *api
    environment:
      <<: *environment
      API_PROTOCOL: advanced
  worker:
    build: .
    command: [pnpm, worker]
    env_file: '${FUMIAO_SERVICE_ENV:-.env}'
    environment: *environment
    volumes: ['media:/app/media']
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  web:
    build: .
    command: [pnpm, 'start:web']
    environment:
      LEGACY_API_INTERNAL_URL: 'http://api:4000'
      API_INTERNAL_URL: 'http://api-v2:4000'
      STUDIO_MODE: '${STUDIO_MODE:-original}'
      STUDIO_CANVAS_EDITOR: '${STUDIO_CANVAS_EDITOR:-}'
      STUDIO_MEDIA_ORIGIN: '${STUDIO_MEDIA_ORIGIN:-}'
    ports: ['127.0.0.1:${FUMIAO_WEB_PORT:-3000}:3000']
    depends_on:
      api: {condition: service_healthy}
      api-v2: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres:
  redis:
  media:
