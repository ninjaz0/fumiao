name: Advanced platform
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test
        ports: ['15432:5432']
        options: --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-bookworm
        ports: ['16379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://test:test_password@127.0.0.1:15432/test
      TEST_REDIS_URL: redis://127.0.0.1:16379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg postgresql redis-server
          echo "PG_BINDIR=$(pg_config --bindir)" >> "$GITHUB_ENV"
          echo "STUDIO_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - run: python -m pip install -r baseline/production/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: |
          python3 scripts/preview-original.py --check
          python3 scripts/list-original-routes.py --check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:web
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install the private S3 test server
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 -o seaweedfs.tar.gz https://github.com/seaweedfs/seaweedfs/releases/download/4.54/linux_amd64.tar.gz
          echo "e7424a82eee327809bfa449fda4924c9a0f42f6669a01288eebb1b79674c8196  seaweedfs.tar.gz" | sha256sum --check
          tar -xzf seaweedfs.tar.gz weed
          echo "STUDIO_WEED=$PWD/weed" >> "$GITHUB_ENV"
      - run: pnpm test:studio:nest --routes --s3
      - run: pnpm test:studio:upgrade
      - run: pnpm test:auth
      - run: pnpm test:home
      - run: pnpm test:canvas-portable-references
      - run: docker build -t fumiao-advanced:ci .
