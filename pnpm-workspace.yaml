packages:
  - apps/*
  - packages/*
  - plugins/*
onlyBuiltDependencies:
  - sharp
  - esbuild
  - '@nestjs/core'
packageExtensions:
  # Its multer helpers require rxjs without declaring it.
  '@nestjs/platform-express':
    peerDependencies:
      rxjs: '^7.1.0'
# Mounted source trees and a few packages with undeclared imports resolve
# third-party modules from the root.
publicHoistPattern:
  - '*'
# One version per third-party dependency for the whole workspace.
catalog:
  '@aws-sdk/client-s3': ^3.0.0
  '@aws-sdk/s3-request-presigner': ^3.0.0
  '@electric-sql/pglite': ^0.3.0
  '@nestjs/common': ^11.1.0
  '@nestjs/core': ^11.1.0
  '@nestjs/platform-express': ^11.1.0
  '@phenomen/libavif-wasm': '1.4.203'
  '@playwright/test': ^1.65.1
  '@types/express': ^5.0.0
  '@types/node': ^24.0.0
  '@types/pg': ^8.15.0
  '@types/react-dom': ^19.2.0
  '@types/react': ^19.2.0
  '@xyflow/react': ^12.9.3
  ajv: ^8.17.1
  bullmq: ^5.0.0
  dompurify: '3.4.17'
  esbuild: '0.28.2'
  eslint-plugin-import-x: '4.18.1'
  eslint: '10.15.0'
  express: ^5.2.1
  gifuct-js: '2.1.2'
  lucide-react: '0.577.0'
  marked: '18.1.3'
  next: ^16.0.0
  pg: ^8.16.0
  prettier: ^3.10.1
  quickjs-emscripten: ^0.32.0
  react-dom: ^19.2.0
  react: ^19.2.0
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  sharp: ^0.35.5
  stream-json: '3.9.0'
  tsx: ^4.20.0
  typescript-eslint: '8.72.2'
  typescript: ^5.9.0
  zod: ^4.0.0
